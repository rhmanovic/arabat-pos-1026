name: Staging smoke (temporary push-triggered run)

on:
  push:
    branches: ['smoke/**']

jobs:
  forgot-password:
    name: forgot-password on staging
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Health (readiness)
        run: |
          code=$(curl -sS -o body.json -w '%{http_code}' "https://web-production-bf628.up.railway.app/api/v1/health/ready")
          echo "HTTP $code"; cat body.json; echo
          test "$code" = 200
      - name: Request a password reset
        run: |
          body=$(jq -cn --arg e "eng.dugaim@gmail.com" --arg i "manager" '{email: $e, interface: $i}')
          code=$(curl -sS -o body.json -w '%{http_code}' \
            -X POST "https://web-production-bf628.up.railway.app/api/v1/auth/password/forgot" \
            -H 'content-type: application/json' --data "$body")
          echo "HTTP $code"; cat body.json; echo
          test "$code" = 202
